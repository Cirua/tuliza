<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tuliza - Resources</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="navbar" aria-label="Main navigation">
    <a class="logo" href="/student.html">
      <div class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 1C4.7 1 2 3.7 2 7c0 2.1 1.1 4 2.7 5.1L8 15l3.3-2.9C12.9 11 14 9.1 14 7c0-3.3-2.7-6-6-6zm0 8c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/>
        </svg>
      </div>
      <span class="logo-text">Tuliz<span class="accent-letter">a</span></span>
    </a>
    <div class="nav-tabs" role="navigation" aria-label="Section links">
      <a class="nav-tab" href="/student.html">Dashboard</a>
      <a class="nav-tab" href="/chat-ui.html">Chat</a>
      <a class="nav-tab active" href="/resources.html" aria-current="page">Resources</a>
      <a class="nav-tab" href="/journal.html">Journal</a>
      <a class="nav-tab" href="/account.html">Account</a>
    </div>
  </nav>

  <main class="resources-main">
    <h1>Wellness Resources</h1>
    <section class="resource-toolbar" aria-label="Resource filters">
      <div class="resource-search-wrap">
        <label class="sr-only" for="resource-search">Search resources</label>
        <input id="resource-search" class="resource-search-input" type="search" placeholder="Search topics, e.g. anxiety, sleep, exams" />
      </div>
      <div class="resource-filter-chips" role="group" aria-label="Filter resources by category">
        <button class="resource-chip active" type="button" data-filter="all">All</button>
        <button class="resource-chip" type="button" data-filter="stress">Stress</button>
        <button class="resource-chip" type="button" data-filter="anxiety">Anxiety</button>
        <button class="resource-chip" type="button" data-filter="sleep">Sleep</button>
        <button class="resource-chip" type="button" data-filter="mindset">Mindset</button>
      </div>
    </section>

    <p class="resource-result-count" id="resource-result-count" aria-live="polite"></p>

    <section class="grid" aria-label="Resource list" id="resource-grid"></section>
    <p class="resource-empty-state" id="resource-empty-state" style="display:none;">No resources matched your search. Try another keyword or filter.</p>
  </main>

  <script>
    const searchInput = document.getElementById('resource-search');
    const filterButtons = Array.from(document.querySelectorAll('.resource-chip'));
    const resourceGrid = document.getElementById('resource-grid');
    let resourceCards = [];
    const emptyState = document.getElementById('resource-empty-state');
    const resultCount = document.getElementById('resource-result-count');

    let activeFilter = 'all';

    function normalize(text) {
      return String(text || '').toLowerCase().trim();
    }

    function inferCategory(resource) {
      const haystack = normalize(`${resource.category || ''} ${resource.title || ''} ${resource.description || ''}`);
      if (haystack.includes('sleep')) return 'sleep';
      if (haystack.includes('anxiety') || haystack.includes('panic') || haystack.includes('breath')) return 'anxiety';
      if (haystack.includes('mindset') || haystack.includes('journal') || haystack.includes('reflection')) return 'mindset';
      if (haystack.includes('stress') || haystack.includes('exam') || haystack.includes('pressure')) return 'stress';
      return 'mindset';
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, '&#96;');
    }

    function buildResourceCard(resource) {
      const resourceId = Number(resource.resourceId);
      const title = String(resource.title || 'Untitled resource').trim();
      const description = String(resource.description || 'Helpful guidance for your wellbeing journey.').trim();
      const category = inferCategory(resource);
      const categoryLabel = String(resource.category || category).trim() || category;
      const link = Number.isInteger(resourceId) && resourceId > 0
        ? `/resource-detail.html?resourceId=${resourceId}`
        : `resource-detail.html?topic=${encodeURIComponent(title.toLowerCase().replace(/\s+/g, '-'))}`;
      const safeTitle = escapeHtml(title);
      const safeDescription = escapeHtml(description);
      const safeCategoryLabel = escapeHtml(categoryLabel);
      const safeLink = escapeAttr(link);
      const safeTags = escapeAttr(`${categoryLabel} ${title} ${description}`);

      return `
        <a class="resource-card-link" href="${safeLink}" data-resource-card data-title="${escapeAttr(title)}" data-tags="${safeTags}" data-category="${escapeAttr(category)}">
          <article class="card">
            <div class="thumb">
              <span class="tag" style="position:absolute; left:12px; top:12px;">${safeCategoryLabel}</span>
            </div>
            <div class="card-body">
              <span class="tag">${safeCategoryLabel}</span>
              <h2>${safeTitle}</h2>
              <p>${safeDescription}</p>
            </div>
          </article>
        </a>
      `;
    }

    async function loadAdminManagedResources() {
      try {
        const response = await fetch('/api/resources');
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) return;

        const rows = Array.isArray(payload.rows) ? payload.rows : [];
        if (!rows.length) {
          resourceGrid.innerHTML = '';
          resourceCards = [];
          return;
        }

        resourceGrid.innerHTML = rows.map((row) => buildResourceCard(row)).join('');
        resourceCards = Array.from(document.querySelectorAll('[data-resource-card]'));
      } catch (_) {
        // Keep static fallback cards if API is not available.
      }
    }

    function applyFilters() {
      const query = normalize(searchInput ? searchInput.value : '');
      let visibleCount = 0;

      resourceCards.forEach((card) => {
        const title = normalize(card.getAttribute('data-title'));
        const tags = normalize(card.getAttribute('data-tags'));
        const category = normalize(card.getAttribute('data-category'));

        const filterMatch = activeFilter === 'all' || category === activeFilter;
        const searchMatch = !query || title.includes(query) || tags.includes(query);
        const shouldShow = filterMatch && searchMatch;

        card.style.display = shouldShow ? '' : 'none';
        card.classList.toggle('resource-hidden', !shouldShow);
        if (shouldShow) visibleCount += 1;
      });

      if (emptyState) emptyState.style.display = visibleCount === 0 ? 'block' : 'none';
      if (resultCount) {
        resultCount.textContent = visibleCount === 1 ? '1 resource found' : `${visibleCount} resources found`;
      }
    }

    filterButtons.forEach((button) => {
      button.addEventListener('click', () => {
        activeFilter = normalize(button.getAttribute('data-filter')) || 'all';
        filterButtons.forEach((chip) => chip.classList.remove('active'));
        button.classList.add('active');
        applyFilters();
      });
    });

    if (searchInput) {
      searchInput.addEventListener('input', applyFilters);
    }

    (async () => {
      await loadAdminManagedResources();
      applyFilters();
    })();
  </script>

</body>
</html>
