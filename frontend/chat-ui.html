<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tuliza - Conversations</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <main class="detail-main">
      <div class="role-panel-head" style="margin-bottom:12px;">
        <a id="chat-back-btn" class="btn-ghost-modal" href="/account.html" aria-label="Go back to dashboard">Back to dashboard</a>
      </div>
      <h1 style="margin-bottom:12px;">Conversations</h1>

      <section class="detail-card chat-wrap" id="chat-student-panel" hidden>
        <div class="chat-main" data-chat-main>
          <div class="chat-header">
            <div class="session-row">
              <div>
                <div style="font-weight:700;">Student Chat</div>
                <div class="chat-sub" data-chat-header>Not connected</div>
              </div>
              <button data-chat-clear class="btn-ghost-modal" type="button">Clear</button>
            </div>
          </div>

          <div class="chat-messages" data-chat-messages aria-live="polite"></div>

          <form class="chat-input-row" data-chat-input-form>
            <input data-chat-input class="chat-input" type="text" required placeholder="Type your message..." />
            <button class="send-btn" type="submit">Send</button>
          </form>
        </div>
      </section>

      <section class="detail-card chat-wrap chat-staff-wrap" id="chat-staff-panel" hidden>
        <div class="chat-layout">
          <aside class="chat-thread-panel" data-chat-thread-panel>
            <div class="chat-thread-panel-head">
              <h2>Students</h2>
              <p data-chat-thread-help class="chat-thread-help">Choose a student to open their chat box.</p>
            </div>
            <div data-chat-thread-list class="chat-thread-list" aria-label="Student conversations"></div>
          </aside>

          <div class="chat-main" data-chat-main>
            <div class="chat-header">
              <div class="session-row">
                <div>
                  <div style="font-weight:700;">Staff Chat</div>
                  <div class="chat-sub" data-chat-header>Not connected</div>
                </div>
                <button data-chat-clear class="btn-ghost-modal" type="button">Clear</button>
              </div>
            </div>

            <div class="chat-messages" data-chat-messages aria-live="polite"></div>

            <form class="chat-input-row" data-chat-input-form>
              <input data-chat-input class="chat-input" type="text" required placeholder="Type your message..." />
              <button class="send-btn" type="submit">Send</button>
            </form>
          </div>
        </div>
      </section>

      <!-- Join modal -->
      <div class="modal-overlay" id="chat-join-modal" style="display:none;">
        <div class="modal" style="max-width:520px;">
          <div class="modal-header">
            <div class="modal-eyebrow">Student ↔ Mentor/Psychiatrist</div>
            <h2 class="modal-title">Join conversation</h2>
            <p class="modal-subtitle">Enter your user ID. Role and recipient are resolved automatically.</p>
          </div>

          <form id="chat-join-form" class="auth-card" style="box-shadow:none; border:none;">
            <div class="form-group">
              <label class="form-label" for="chat-username">Your user ID</label>
              <input id="chat-username" class="form-input" type="text" required placeholder="e.g., STU-001" />
            </div>

            <div class="modal-actions">
              <button type="submit" class="btn-primary">Join</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="/backend/chat.js"></script>
  <script>
    (function () {
      const backBtn = document.getElementById('chat-back-btn');
      if (!backBtn) return;

      let sessionUser = {};
      try {
        sessionUser = JSON.parse(sessionStorage.getItem('tuliza_session_user') || '{}');
      } catch (_) {
        sessionUser = {};
      }

      const role = String(sessionUser.role || '').toLowerCase();
      const dashboardByRole = {
        student: '/student.html',
        mentor: '/mentor.html',
        psychiatrist: '/psychologist.html',
        admin: '/admin.html',
      };

      backBtn.href = dashboardByRole[role] || '/account.html';
    })();
  </script>
</body>
</html>
