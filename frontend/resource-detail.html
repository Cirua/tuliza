<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tuliza - Resource Details</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="resource-detail-page video-unavailable">
  <div class="ambient-video-wrap" aria-hidden="true">
    <div class="waterfall-fallback"></div>
    <video id="waterfall-video" class="ambient-video" autoplay muted loop playsinline>
      <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4" />
      <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm" type="video/webm" />
    </video>
    <div class="matte-layer"></div>
  </div>

  <nav class="navbar" aria-label="Main navigation">
    <a class="logo" href="/student.html">
      <div class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 1C4.7 1 2 3.7 2 7c0 2.1 1.1 4 2.7 5.1L8 15l3.3-2.9C12.9 11 14 9.1 14 7c0-3.3-2.7-6-6-6zm0 8c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/>
        </svg>
      </div>
      <span class="logo-text">Tuliz<span class="accent-letter">a</span></span>
    </a>
    <div class="nav-tabs" role="navigation" aria-label="Section links">
      <a class="nav-tab" href="/student.html">Dashboard</a>
      <a class="nav-tab" href="/chat-ui.html">Chat</a>
      <a class="nav-tab active" href="/resources.html" aria-current="page">Resources</a>
      <a class="nav-tab" href="/journal.html">Journal</a>
      <a class="nav-tab" href="/account.html">Account</a>
    </div>
  </nav>

  <main class="detail-main">
    <section class="detail-card">
      <h1 id="resource-title" class="detail-title">Wellness Resource</h1>
      <p id="resource-subtitle" class="subtitle">Practical steps you can apply right away.</p>
    </section>

    <section class="detail-card">
      <h2>In-depth Guide</h2>
      <div id="resource-content" class="subtitle" style="white-space:pre-wrap; line-height:1.8; color:var(--text-soft);">Loading resource details...</div>
      <div class="modal-actions">
        <a id="resource-source-link" class="btn-primary" href="#" target="_blank" rel="noreferrer noopener" style="display:none;">Open source link</a>
        <a class="btn-ghost-modal" href="/resources.html">Back to resources</a>
      </div>
    </section>
  </main>

  <script>
    const titleEl = document.getElementById('resource-title');
    const subtitleEl = document.getElementById('resource-subtitle');
    const contentEl = document.getElementById('resource-content');
    const sourceLinkEl = document.getElementById('resource-source-link');

    function safeText(value, fallback) {
      const text = String(value || '').trim();
      return text || String(fallback || '');
    }

    function getResourceIdFromQuery() {
      const params = new URLSearchParams(window.location.search || '');
      const id = Number(params.get('resourceId'));
      if (!Number.isInteger(id) || id <= 0) return null;
      return id;
    }

    function applyResource(resource) {
      const title = safeText(resource?.title, 'Wellness Resource');
      const category = safeText(resource?.category, 'General wellbeing');
      const description = safeText(resource?.description, 'Helpful guidance for your wellbeing journey.');
      const content = safeText(resource?.resourceContent, description);

      document.title = `Tuliza - ${title}`;
      titleEl.textContent = title;
      subtitleEl.textContent = `${category}: ${description}`;
      contentEl.textContent = content;
      sourceLinkEl.style.display = 'none';
    }

    async function loadResourceFromList(resourceId) {
      const response = await fetch('/api/resources');
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(safeText(payload.error, 'Could not load resources.'));

      const rows = Array.isArray(payload.rows) ? payload.rows : [];
      const match = rows.find((row) => Number(row.resourceId) === Number(resourceId));
      if (!match) throw new Error('Resource not found.');

      return match;
    }

    async function loadResourceDetail() {
      const resourceId = getResourceIdFromQuery();
      if (!resourceId) {
        contentEl.textContent = 'Resource not found. Open a resource from the resources page.';
        return;
      }

      try {
        const response = await fetch(`/api/resources/${encodeURIComponent(String(resourceId))}`);
        const payload = await response.json().catch(() => ({}));

        if (!response.ok) {
          const fallbackResource = await loadResourceFromList(resourceId);
          applyResource(fallbackResource);
          return;
        }

        applyResource(payload.resource || {});
      } catch (_) {
        try {
          const fallbackResource = await loadResourceFromList(resourceId);
          applyResource(fallbackResource);
        } catch (innerErr) {
          contentEl.textContent = safeText(innerErr?.message, 'Could not load resource details.');
        }
      }
    }

    loadResourceDetail();
  </script>
</body>
</html>
