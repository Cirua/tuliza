<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tuliza - View Users</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="navbar" aria-label="Main navigation">
    <a class="logo" href="/admin.html">
      <div class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 1C4.7 1 2 3.7 2 7c0 2.1 1.1 4 2.7 5.1L8 15l3.3-2.9C12.9 11 14 9.1 14 7c0-3.3-2.7-6-6-6zm0 8c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/>
        </svg>
      </div>
      <span class="logo-text">Tuliz<span class="accent-letter">a</span></span>
    </a>
    <div class="nav-tabs" role="navigation" aria-label="Admin pages">
      <a class="nav-tab" href="/admin.html">Admin</a>
      <a class="nav-tab active" href="/admin-users.html" aria-current="page">View Users</a>
      <a class="nav-tab" href="/admin-assignments.html">View Assignments</a>
      <button id="logout-btn" class="nav-tab" type="button">Logout</button>
    </div>
  </nav>

  <main class="role-main fade-up">
    <section class="role-hero">
      <div>
        <p class="role-eyebrow">Platform operations</p>
        <h1>View users</h1>
        <p class="subtitle">Manage staff user accounts without crowding the main admin dashboard.</p>
      </div>
    </section>

    <section class="role-layout fade-up fade-up-delay-1" style="grid-template-columns: 1fr;">
      <article class="role-panel">
        <div class="role-panel-head">
          <h2>Edit Staff Login</h2>
        </div>
        <form id="edit-staff-form" class="auth-card" style="box-shadow:none; border:none; padding:0; margin-bottom:16px;">
          <input id="edit-signup-id" type="hidden" />
          <div class="form-group">
            <label class="form-label" for="edit-role">Role</label>
            <input id="edit-role" class="form-input" readonly />
          </div>
          <div class="form-group"><label class="form-label" for="edit-full-name">Full name</label><input id="edit-full-name" class="form-input" /></div>
          <div class="form-group"><label class="form-label" for="edit-email">Email</label><input id="edit-email" class="form-input" type="email" required /></div>
          <div class="form-group">
            <label class="form-label" for="edit-password">New password (optional)</label>
            <div class="password-field">
              <input id="edit-password" class="form-input" type="password" placeholder="Leave blank to keep current password" />
              <button
                type="button"
                id="toggle-edit-password"
                class="password-toggle"
                aria-label="Show password"
                aria-pressed="false"
              >Show</button>
            </div>
          </div>
          <div class="modal-actions">
            <button class="btn-primary" type="submit">Save changes</button>
            <button id="clear-edit-form" class="btn-ghost-modal" type="button">Clear</button>
          </div>
          <p id="edit-msg" class="role-help-text"></p>
        </form>
      </article>

      <article class="role-panel">
        <div class="role-panel-head">
          <h2>Users</h2>
        </div>
        <div class="role-table-wrap">
          <table class="role-table" aria-label="Users table">
            <thead>
              <tr>
                <th>Signup ID</th>
                <th>User ID</th>
                <th>Name</th>
                <th>Role</th>
                <th>Email</th>
                <th>Created</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="users-body"></tbody>
          </table>
        </div>
      </article>
    </section>
  </main>

  <script>
    const usersBody = document.getElementById('users-body');
    const logoutBtn = document.getElementById('logout-btn');

    const editStaffForm = document.getElementById('edit-staff-form');
    const editSignupIdInput = document.getElementById('edit-signup-id');
    const editRoleInput = document.getElementById('edit-role');
    const editFullNameInput = document.getElementById('edit-full-name');
    const editEmailInput = document.getElementById('edit-email');
    const editPasswordInput = document.getElementById('edit-password');
    const toggleEditPasswordButton = document.getElementById('toggle-edit-password');
    const clearEditFormButton = document.getElementById('clear-edit-form');
    const editMessage = document.getElementById('edit-msg');

    let userRows = [];

    function safeText(value) {
      return String(value || '').trim() || '-';
    }

    function formatDate(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '-';
      return date.toLocaleString();
    }

    function setEditMessage(message, isError) {
      editMessage.textContent = message || '';
      editMessage.style.color = isError ? '#B42318' : '#146C43';
    }

    function resetEditForm() {
      editSignupIdInput.value = '';
      editRoleInput.value = '';
      editFullNameInput.value = '';
      editEmailInput.value = '';
      editPasswordInput.value = '';
      editPasswordInput.type = 'password';
      if (toggleEditPasswordButton) {
        toggleEditPasswordButton.textContent = 'Show';
        toggleEditPasswordButton.setAttribute('aria-pressed', 'false');
        toggleEditPasswordButton.setAttribute('aria-label', 'Show password');
      }
      setEditMessage('', false);
    }

    async function api(url, options) {
      const response = await fetch(url, options);
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(payload.error || 'Request failed');
      }
      return payload;
    }

    function renderUsers(rows) {
      usersBody.innerHTML = '';
      if (!rows.length) {
        usersBody.innerHTML = '<tr><td colspan="7">No users found.</td></tr>';
        return;
      }

      userRows = rows.slice();

      rows.forEach((row) => {
        const normalizedRole = String(row.role || '').toLowerCase();
        const canManage = normalizedRole === 'mentor' || normalizedRole === 'psychiatrist';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${safeText(row.signupId)}</td>
          <td>${safeText(row.userId)}</td>
          <td>${safeText(row.displayName)}</td>
          <td>${safeText(row.role)}</td>
          <td>${safeText(row.email)}</td>
          <td>${safeText(formatDate(row.createdAt))}</td>
          <td>
            ${canManage
              ? `<button class="role-mini-btn" type="button" data-user-edit="${safeText(row.signupId)}">Edit</button>
                 <button class="role-mini-btn" type="button" data-user-delete="${safeText(row.signupId)}">Delete</button>`
              : '<span style="opacity:.7;">-</span>'}
          </td>
        `;
        usersBody.appendChild(tr);
      });
    }

    async function loadUsers() {
      const payload = await api('/api/admin/dashboard-data');
      const users = Array.isArray(payload.users) ? payload.users : [];
      renderUsers(users);
    }

    usersBody.addEventListener('click', async (event) => {
      const editId = event.target.getAttribute('data-user-edit');
      const deleteId = event.target.getAttribute('data-user-delete');

      if (editId) {
        const row = userRows.find((item) => String(item.signupId) === String(editId));
        if (!row) return;

        editSignupIdInput.value = String(row.signupId || '');
        editRoleInput.value = String(row.role || '');
        editFullNameInput.value = String(row.displayName || '');
        editEmailInput.value = String(row.email || '');
        editPasswordInput.value = '';
        setEditMessage('Editing user #' + safeText(row.signupId), false);
        editStaffForm.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      if (deleteId) {
        if (!window.confirm('Delete this staff account?')) return;
        try {
          await api('/api/admin/staff-accounts/' + encodeURIComponent(deleteId), { method: 'DELETE' });
          await loadUsers();
          resetEditForm();
          setEditMessage('Staff account deleted successfully.', false);
        } catch (err) {
          setEditMessage(err.message || 'Failed to delete staff account.', true);
        }
      }
    });

    editStaffForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      const signupId = editSignupIdInput.value.trim();
      if (!signupId) {
        setEditMessage('Select a mentor or psychiatrist from the table first.', true);
        return;
      }

      const payload = {
        email: editEmailInput.value.trim(),
        fullName: editFullNameInput.value.trim(),
        password: editPasswordInput.value,
      };

      try {
        const response = await api('/api/admin/staff-accounts/' + encodeURIComponent(signupId), {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        await loadUsers();
        setEditMessage(response.message || 'Staff account updated successfully.', false);
      } catch (err) {
        setEditMessage(err.message || 'Failed to update staff account.', true);
      }
    });

    if (toggleEditPasswordButton && editPasswordInput) {
      toggleEditPasswordButton.addEventListener('click', () => {
        const isHidden = editPasswordInput.type === 'password';
        editPasswordInput.type = isHidden ? 'text' : 'password';
        toggleEditPasswordButton.textContent = isHidden ? 'Hide' : 'Show';
        toggleEditPasswordButton.setAttribute('aria-pressed', String(isHidden));
        toggleEditPasswordButton.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
      });
    }

    clearEditFormButton.addEventListener('click', resetEditForm);

    logoutBtn.addEventListener('click', () => {
      sessionStorage.removeItem('tuliza_session_token');
      sessionStorage.removeItem('tuliza_session_user');
      window.location.href = '/account.html';
    });

    (async function enforceRoleAccess() {
      let sessionUser = {};
      try {
        sessionUser = JSON.parse(sessionStorage.getItem('tuliza_session_user') || '{}');
      } catch (_) {
        sessionUser = {};
      }

      if (String(sessionUser.role || '').toLowerCase() !== 'admin') {
        window.location.href = '/account.html';
        return;
      }

      try {
        await loadUsers();
      } catch (err) {
        usersBody.innerHTML = '<tr><td colspan="7">' + safeText(err.message || 'Failed to load users.') + '</td></tr>';
      }

      setInterval(() => {
        loadUsers().catch(() => {});
      }, 15000);
    })();
  </script>
</body>
</html>
